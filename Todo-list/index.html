<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tareas</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>Lista de tareas</h1>
    </header>
    <main>
        <section>
            <h2>Añadir una tarea</h2>
            <form>
                <label for="nueva-tarea">Nueva tarea</label>
                <input type="text" id="nueva-tarea" name="nueva-tarea">
                <button type="submit">Añadir tarea</button>
            </form>
        </section>
        <section>
            <h2>Tareas pendientes</h2>
            <ul>
                <li>
                    <input type="checkbox" id="tarea-1" name="tareas" value="tarea-1">
                    <label for="tarea-1">Preparar el desayuno</label>
                </li>
                <li>
                    <input type="checkbox" id="tarea-2" name="tareas" value="tarea-2">
                    <label for="tarea-2">Ordenar la casa</label>
                    </li>
                <li>
                    <input type="checkbox" id="tarea-3" name="tareas" value="tarea-3">
                    <label for="tarea-3">Preparar la comida</label>
                    </li>
                <li>
                   <input type="checkbox" id="tarea-4" name="tareas" value="tarea-4">
                    <label for="tarea-4">Hacer la compra</label>
                    </li>
                <li>
                    <input type="checkbox" id="tarea-5" name="tareas" value="tarea-5">
                    <label for="tarea-5">Estudiar</label>
                    </li>
            </ul>
            <button type="button">Eliminar tareas completadas</button>
            <button type="button">Eliminar todas las tareas</button>
        </section>
    </main>
    
</body>
</html>
